<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="color-scheme" content="dark">
<title>Meu Inglês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0F11; --superficie: #17191C; --superficie-2: #202328; --nav: #141619;
    --lateral: #111316; --lateral-borda: #1E2125;
    --borda: #2A2E34; --borda-suave: #22252A; --borda-forte: #3A3F47;
    --texto: #F2F3F5; --texto-2: #C9CDD3; --suave: #9BA1AA; --apagado: #6B717A;
    --destaque: #FF6A3D; --destaque-hover: #FF7D55; --destaque-tinta: #1B0D06; --destaque-fundo: #2A1A13;
    --ok: #4CC38A; --ok-fundo: rgba(76, 195, 138, .1); --desce: #FF8A63; --erro: #E5484D;
    --fonte: Barlow, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --fonte-titulo: "Barlow Condensed", "Arial Narrow", Barlow, system-ui, sans-serif;
    --raio: 16px; --raio-p: 12px;
    --altura-nav: 72px;
    --seguro-baixo: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 16px/1.45 var(--fonte);
         -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  input, select, textarea, button { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--texto); }
  :focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
  svg { flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num-fonte { font-family: var(--fonte-titulo); font-variant-numeric: tabular-nums; }

  /* ---------- campos e botões ---------- */
  label, .rotulo-campo { display: block; font-size: .8125rem; font-weight: 600; color: var(--suave); margin-bottom: 6px; }
  input, select, textarea { width: 100%; min-height: 48px; padding: 0 14px; border-radius: var(--raio-p);
         border: 1px solid var(--borda); background: var(--superficie-2); color: var(--texto); font-size: 16px; }
  input::placeholder { color: var(--apagado); }
  .campo { margin-bottom: 14px; }

  .botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
           padding: 0 18px; border-radius: 14px; border: 1px solid var(--borda); background: transparent;
           color: var(--texto); font-weight: 600; font-size: 15px; text-decoration: none; }
  .botao:disabled { opacity: .5; cursor: default; }
  .primario { background: var(--destaque); border-color: var(--destaque); color: var(--destaque-tinta);
              font-family: var(--fonte-titulo); font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .primario:hover { background: var(--destaque-hover); }
  .grande { width: 100%; min-height: 56px; border-radius: var(--raio); font-size: 22px; }
  .botao.largo { width: 100%; min-height: 56px; border-radius: var(--raio); }
  .icone { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 22px; border: 0;
           background: transparent; color: var(--suave); display: inline-grid; place-items: center; }
  .icone:hover { color: var(--texto); background: var(--superficie-2); }
  .icone:disabled { opacity: .35; cursor: default; }

  .sobretitulo { font-size: .8125rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 20px; }
  .vazio { color: var(--suave); text-align: center; padding: 28px 16px; }
  .dica { font-size: 14px; color: var(--suave); }
  .grupo-titulo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 24px 4px 10px; }
  .grupo-titulo span { font-weight: 600; letter-spacing: 0; text-transform: none; }

  .busca { position: relative; margin: 0; }
  .busca svg { position: absolute; left: 14px; top: 15px; color: var(--suave); pointer-events: none; }
  .busca input { padding-left: 42px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--borda-forte); background: transparent;
          color: var(--texto-2); font-size: 14px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--bg); }
  .chips.rolavel { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .chips.rolavel::-webkit-scrollbar { display: none; }
  .chips.rolavel .chip { flex: none; }

  .resumo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 8px; }
  .stat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; border-radius: var(--raio);
          background: var(--superficie); border: 1px solid var(--borda); min-width: 0; }
  .stat span { font-size: 13px; color: var(--suave); }
  .stat b { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 700; line-height: 1.05;
            font-variant-numeric: tabular-nums; white-space: nowrap; }
  .positivo { color: var(--ok); }

  .selo { flex: none; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--borda-forte); color: var(--texto-2);
          font-family: var(--fonte-titulo); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .selo.feita { border-color: var(--ok); color: var(--ok); background: var(--ok-fundo); }

  .trilho { position: relative; height: 6px; border-radius: 3px; background: var(--borda); margin-top: 8px; }
  .trilho span { display: block; height: 100%; border-radius: 3px; background: var(--destaque); }
  .trilho .dentro { background: var(--ok); }

  /* ---------- login ---------- */
  .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .login-caixa { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca-icone { width: 44px; height: 44px; border-radius: 12px; background: var(--destaque); color: var(--destaque-tinta);
                 display: grid; place-items: center; }
  .marca-nome { font-family: var(--fonte-titulo); font-size: 32px; font-weight: 700; line-height: 1; }
  .login form { padding: 20px; }
  .login h2 { font-family: var(--fonte-titulo); font-size: 26px; margin-bottom: 16px; }
  .ou { display: flex; align-items: center; gap: 12px; color: var(--suave); font-size: .875rem; margin: 18px 0; }
  .ou::before, .ou::after { content: ""; flex: 1; border-top: 1px solid var(--borda); }
  #entrar-google { width: 100%; }

  /* ---------- estrutura do app ---------- */
  .conteudo { max-width: 640px; margin: 0 auto;
              padding: 0 16px calc(var(--altura-nav) + var(--seguro-baixo) + 24px); }
  .pagina-topo { display: flex; flex-direction: column; gap: 14px; padding: 24px 0 16px; }
  .pagina-topo h1, .titulo-pagina { font-family: var(--fonte-titulo); font-size: 34px; font-weight: 700; line-height: 1; }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr)); height: calc(var(--altura-nav) + var(--seguro-baixo));
            padding-bottom: var(--seguro-baixo); background: var(--nav); border-top: 1px solid var(--borda-suave); }
  .tabbar .marca { display: none; }
  .nav-botao { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
               background: transparent; border: 0; color: var(--suave); font-size: 12px; font-weight: 600; padding: 0; }
  .nav-botao .pilula { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; }
  .nav-botao[aria-current="page"] { color: var(--destaque); font-weight: 700; }
  .nav-botao[aria-current="page"] .pilula { background: var(--destaque-fundo); }

  .conta { position: relative; flex: none; }
  .avatar { width: 44px; height: 44px; border-radius: 22px; background: var(--superficie-2); border: 1px solid var(--borda);
            font-weight: 700; font-size: 15px; }
  .menu-conta { position: absolute; right: 0; top: 52px; z-index: 30; width: 240px; padding: 12px;
                display: flex; flex-direction: column; gap: 10px; background: var(--superficie-2); border: 1px solid var(--borda);
                border-radius: var(--raio); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  .menu-conta small { color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- hoje ---------- */
  .topo-dia { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 16px; }
  .seletor-dia { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .seletor-dia div { min-width: 132px; text-align: center; }
  .seletor-dia h1 { font-family: var(--fonte-titulo); font-size: 34px; font-weight: 700; line-height: 1; }
  .dia-cartao { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .dia-cartao h2 { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .dia-cartao .linha-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .feito-em { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 14px; margin-top: 4px; }
  .voltar-pendente { margin-bottom: 12px; }

  .passos { list-style: none; margin: 0; padding: 4px 16px; }
  .passo { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 14px 0; }
  .passo + .passo { border-top: 1px solid var(--borda-suave); }
  .passo-min { align-self: start; text-align: center; padding: 4px 0; border-radius: 10px; background: var(--superficie-2);
               font-size: 18px; font-weight: 700; color: var(--texto); }
  .passo.passivo .passo-min { background: transparent; border: 1px dashed var(--borda-forte); color: var(--texto-2); }
  .passo b { display: block; font-weight: 600; }
  .passo p { color: var(--texto-2); font-size: 15px; }
  .passo small { display: block; margin-top: 6px; color: var(--suave); font-size: 13px; }

  .vocab { list-style: none; margin: 0; padding: 4px 16px; }
  .vocab li { display: flex; flex-direction: column; padding: 10px 0; overflow-wrap: anywhere; }
  .vocab li + li { border-top: 1px solid var(--borda-suave); }
  .vocab b { font-weight: 600; }
  .vocab span { color: var(--suave); font-size: 14px; }

  .acao-dia { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .concluida { padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .concluida .selo-ok { width: 72px; height: 72px; border-radius: 36px; background: var(--ok); color: var(--bg); display: grid; place-items: center; }
  .concluida h1 { font-family: var(--fonte-titulo); font-size: 34px; font-weight: 700; line-height: 1; }

  /* ---------- roteiro ---------- */
  .lista-semanas { display: flex; flex-direction: column; gap: 12px; }
  .semana-card { width: 100%; text-align: left; padding: 16px; display: flex; flex-direction: column; gap: 4px; color: var(--texto); }
  .semana-card:hover { border-color: var(--borda-forte); }
  .semana-card[aria-current="true"] { border-color: var(--destaque); }
  .semana-card .linha-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .semana-card h2 { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .semana-card p { color: var(--suave); font-size: 14px; }

  .topo-semana { display: flex; align-items: flex-start; gap: 8px; padding: 20px 0 16px; }
  .topo-semana h1 { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 700; line-height: 1.05; }
  .topo-semana .icone { margin-left: -10px; }
  .bloco { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bloco h3 { font-family: var(--fonte-titulo); font-size: 22px; font-weight: 700; line-height: 1.1; }
  .bloco p { color: var(--texto-2); font-size: 15px; }
  .exemplos { list-style: none; margin: 4px 0 0; padding: 12px 14px; border-radius: var(--raio-p); background: var(--superficie-2);
              display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .lista-texto { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--texto-2); font-size: 15px; }
  .lista-texto small { color: var(--suave); }

  .dias { list-style: none; margin: 0; padding: 0 8px 0 4px; }
  .dias li { display: flex; align-items: center; min-height: 56px; }
  .dias li + li { border-top: 1px solid var(--borda-suave); }
  .marcar { width: 44px; height: 44px; flex: none; padding: 0; border: 0; background: transparent; display: grid; place-items: center; color: transparent; }
  .marcar i { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--borda-forte); display: grid; place-items: center; }
  .marcar[aria-pressed="true"] i { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .dia-abrir { flex: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 4px;
               background: transparent; border: 0; text-align: left; }
  .dia-abrir .nome { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dia-abrir .nome small { color: var(--suave); font-size: 13px; font-weight: 600; }
  .dia-abrir .num-fonte { color: var(--suave); font-size: 16px; font-weight: 600; white-space: nowrap; }
  .dias li.feito .dia-abrir .nome span { color: var(--suave); }
  .dias li[aria-current="step"] .dia-abrir .nome span { color: var(--destaque); font-weight: 600; }

  /* ---------- progresso ---------- */
  .barras-cat { list-style: none; margin: 0; padding: 6px 16px; }
  .barras-cat li { padding: 12px 0; }
  .barras-cat li + li { border-top: 1px solid var(--borda-suave); }
  .linha-cat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .linha-cat .num-fonte { font-size: 18px; font-weight: 700; white-space: nowrap; }

  #aviso { position: fixed; left: 50%; bottom: calc(var(--altura-nav) + var(--seguro-baixo) + 16px); z-index: 40;
           transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
           background: var(--ok); color: var(--bg); font-weight: 600; padding: 12px 18px; border-radius: 12px;
           transition: transform .25s, opacity .25s; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #aviso.visivel { transform: translate(-50%, 0); opacity: 1; }
  #aviso.erro { background: var(--erro); color: var(--texto); }

  /* ---------- desktop / tablet ---------- */
  @media (min-width: 960px) {
    #tela-app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    #tela-app[hidden] { display: none !important; }
    .tabbar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px;
              padding: 24px 16px; background: var(--lateral); border-top: 0; border-right: 1px solid var(--lateral-borda); }
    .tabbar .marca { display: flex; padding: 0 8px; margin-bottom: 24px; }
    .tabbar .marca-icone { width: 36px; height: 36px; border-radius: 10px; }
    .tabbar .marca-nome { font-size: 24px; }
    .nav-botao { flex-direction: row; justify-content: flex-start; gap: 12px;
                 height: 44px; padding: 0 12px; border-radius: var(--raio-p); font-size: 15px; color: var(--texto-2); }
    .nav-botao .pilula { width: auto; height: auto; background: none !important; }
    .nav-botao:hover { background: var(--superficie); }
    .nav-botao[aria-current="page"] { background: var(--destaque-fundo); }
    .conteudo { max-width: 1120px; padding: 12px 40px 48px; margin: 0; width: 100%; }
    .topo-dia, .topo-semana { padding-top: 28px; }
    .hoje-layout, .semana-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 0 24px; align-items: start; }
    .hoje-layout .grupo-titulo:first-child, .semana-layout .grupo-titulo:first-child { margin-top: 20px; }
    .acao-dia { max-width: 420px; }
    .lista-semanas { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .resumo { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .topo-vocab { display: grid; grid-template-columns: auto minmax(0, 360px); align-items: center; column-gap: 24px; }
    .topo-vocab .chips { grid-column: 1 / -1; }
    .chips.rolavel { flex-wrap: wrap; margin: 0; padding: 0; }
    .lista-vocab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; align-items: start; }
    .lista-progresso { max-width: 760px; }
    #aviso { bottom: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- ============ LOGIN ============ -->
  <section id="tela-login" class="login" hidden>
    <div class="login-caixa">
      <div class="marca">
        <span class="marca-icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="M8 9h8M8 12h5"/></svg></span>
        <span class="marca-nome">Meu Inglês</span>
      </div>
      <form id="form-login" class="cartao">
        <h2>Entrar</h2>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" minlength="6" autocomplete="current-password" required>
        </div>
        <button class="botao primario grande" type="submit">Entrar</button>
        <div class="ou">ou</div>
        <button id="entrar-google" class="botao" type="button">Entrar com Google</button>
      </form>
    </div>
  </section>

  <!-- ============ APP ============ -->
  <section id="tela-app" hidden>
    <nav class="tabbar" aria-label="Principal">
      <div class="marca">
        <span class="marca-icone"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="M8 9h8M8 12h5"/></svg></span>
        <span class="marca-nome">Meu Inglês</span>
      </div>
      <button class="nav-botao" data-aba="hoje" type="button">
        <span class="pilula"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>Hoje</button>
      <button class="nav-botao" data-aba="roteiro" type="button">
        <span class="pilula"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>Roteiro</button>
      <button class="nav-botao" data-aba="vocabulario" type="button">
        <span class="pilula"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>Vocabulário</button>
      <button class="nav-botao" data-aba="progresso" type="button">
        <span class="pilula"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Progresso</button>
    </nav>

    <div class="conteudo">
      <!-- Hoje -->
      <section id="aba-hoje" class="aba">
        <header class="topo-dia">
          <div class="seletor-dia">
            <button class="icone" type="button" data-mudar-dia="-1" aria-label="Dia anterior">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <div>
              <span class="sobretitulo" id="hoje-semana"></span>
              <h1 id="hoje-dia"></h1>
            </div>
            <button class="icone" type="button" data-mudar-dia="1" aria-label="Próximo dia">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
          <div class="conta">

  ];

  const DIAS_LONGOS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
  const TIPOS_RECURSO = { yt: 'YouTube', pod: 'áudio', web: 'site', app: 'app', tv: 'série' };
  const TOTAL_DIAS = SEMANAS.length * 7;

  // Semana começa em 1 (como no banco); dia vai de 0 (segunda) a 6 (domingo)
  const chave = (semana, dia) => `${semana}-${dia}`;
  const posicao = (semana, dia) => (semana - 1) * 7 + dia;
  const dePosicao = (p) => ({ semana: Math.floor(p / 7) + 1, dia: p % 7 });

  const palavrasDoGrupo = (grupo) => grupo[1].split(';').map((p) => {
    const [termo, traducao] = p.split('|');
    return { termo, traducao };
  });
  const totalPalavras = (s) => s.v.reduce((t, g) => t + g[1].split(';').length, 0);

  const linkRecurso = (nome, tipo) => (tipo === 'yt'
    ? 'https://www.youtube.com/results?search_query='
    : 'https://www.google.com/search?q=') + encodeURIComponent(nome);

  // Passos dos 30 minutos ativos de um dia
  function passosDoDia(semana, dia) {
    const s = SEMANAS[semana - 1];
    if (dia < 6) {
      return [
        { min: 7, titulo: 'Anki: revisão + vocabulário novo',
          texto: `Revise os cards pendentes. Depois estude as 12 palavras do grupo “${s.v[dia][0]}” e crie cards só das que você ainda não usa (no máximo 10).`,
          recurso: 'Anki + palavras de hoje' },
        { min: 20, titulo: BLOCOS[dia], texto: s.d[dia][0], recurso: s.d[dia][1] },
        { min: 3, titulo: 'Registro', texto: 'Anote de 3 a 5 frases novas e 1 coisa que você não soube dizer hoje.', recurso: 'Diário de Lacunas' },
      ];
    }
    return [
      { min: 7, titulo: 'Anki: revisão geral', texto: 'Revise todos os cards da semana. Suspenda os que estiverem fáceis demais ou inúteis.', recurso: 'Anki' },
      { min: 10, titulo: 'Ouvir as gravações', texto: `Ouça o que você gravou na semana e anote 3 erros que se repetem. Faça o teste: ${s.check}`, recurso: 'Gravador do celular' },
      { min: 5, titulo: 'Lacunas viram cards', texto: 'Transforme o Diário de Lacunas da semana em cards de frase.', recurso: 'Diário de Lacunas + Anki' },
      { min: 5, titulo: 'Repor o barril', texto: 'Adicione de 5 a 10 itens sobre o tema da próxima semana e remova o que não prendeu.', recurso: 'Playlists e fila de podcasts' },
      { min: 3, titulo: 'Registro', texto: 'Marque os números da semana: dias feitos, horas de input, frases mineradas.', recurso: 'Diário de Lacunas' },
    ];
  }
  const minutosDoDia = (semana, dia) => passosDoDia(semana, dia).reduce((t, p) => t + p.min, 0);

  // ---------- autenticação ----------
  // Não há "Criar conta": o banco é pessoal e as contas são criadas pelo painel do Supabase
  $('#form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    const password = $('#senha').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) aviso('Não foi possível entrar: ' + error.message, true);
  });

  // Redireciona para o Google; na volta o supabase-js lê a sessão da URL e dispara onAuthStateChange
  $('#entrar-google').addEventListener('click', async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) aviso('Não foi possível entrar com Google: ' + error.message, true);
  });

  $('#sair').addEventListener('click', () => {
    fecharMenuConta();
    supabase.auth.signOut();
  });

  // Menu da conta (avatar no topo da aba Hoje)
  function fecharMenuConta() {
    $('#menu-conta').hidden = true;
    $('#avatar').setAttribute('aria-expanded', 'false');
  }
  $('#avatar').addEventListener('click', (e) => {
    e.stopPropagation();
    const abrir = $('#menu-conta').hidden;
    $('#menu-conta').hidden = !abrir;
    $('#avatar').setAttribute('aria-expanded', String(abrir));
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.conta')) fecharMenuConta();
  });

  let usuarioAtual = null;
  // setTimeout evita chamar o Supabase de dentro do callback (recomendação da documentação)
  supabase.auth.onAuthStateChange((_evento, session) => {
    setTimeout(() => mostrarTela(session), 0);
  });

  async function mostrarTela(session) {
    const logado = Boolean(session);
    $('#tela-login').hidden = logado;
    $('#tela-app').hidden = !logado;
    if (!logado) { usuarioAtual = null; return; }
    if (usuarioAtual === session.user.id) return;   // ex.: renovação de token

    usuarioAtual = session.user.id;
    const email = session.user.email ?? '';
    $('#usuario').textContent = email;
    $('#avatar').textContent = (email[0] ?? '?').toUpperCase();
    feitos = new Set();
    datas = new Map();
    diaVisto = { semana: 1, dia: 0 };
    desenharChipsVocab();
    desenharTudo();
    abrirAba('hoje');
    await Promise.all([carregarProgresso(), carregarEstado()]);
    filtroVocab = diaVisto.semana;
    desenharChipsVocab();
    desenharTudo();
  }

  // Ao voltar para o app (ex.: depois de estudar em outro aparelho), busca o progresso de novo
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !usuarioAtual || salvando) return;
    await carregarProgresso();
    desenharTudo();
  });

  // ---------- abas ----------
  $$('[data-aba]').forEach((b) =>
    b.addEventListener('click', () => {
      if (b.dataset.aba === 'roteiro') semanaAberta = null;
      abrirAba(b.dataset.aba);
    }));

  function abrirAba(nome) {
    $$('.nav-botao').forEach((b) => {
      if (b.dataset.aba === nome) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $$('.aba').forEach((s) => { s.hidden = s.id !== 'aba-' + nome; });
    window.scrollTo(0, 0);
    if (nome === 'roteiro') desenharRoteiro();
    if (nome === 'vocabulario') desenharVocab();
  }

  // ---------- progresso (banco) ----------
  // feitos: chaves 'semana-dia' dos dias concluídos; datas: chave → quando foi concluído
  let feitos = new Set();
  let datas = new Map();
  let salvando = false;

  async function carregarProgresso() {
    const { data, error } = await supabase.from('day_progress').select('week, day, completed_at');
    if (error) return aviso('Não foi possível ler o progresso: ' + error.message, true);
    feitos = new Set(data.map((l) => chave(l.week, l.day)));
    datas = new Map(data.map((l) => [chave(l.week, l.day), l.completed_at]));
  }

  // Marca ou desmarca um dia. A tela muda na hora; se o banco recusar, volta ao que era.
  async function alternarDia(semana, dia) {
    const k = chave(semana, dia);
    const marcar = !feitos.has(k);
    const dataAntiga = datas.get(k);
    if (marcar) { feitos.add(k); datas.set(k, new Date().toISOString()); }
    else { feitos.delete(k); datas.delete(k); }
    desenharTudo();

    salvando = true;
    const tabela = supabase.from('day_progress');
    const { error } = marcar
      ? await tabela.upsert({ week: semana, day: dia }, { onConflict: 'user_id,week,day', ignoreDuplicates: true })
      : await tabela.delete().match({ week: semana, day: dia });
    salvando = false;
    if (error) {
      if (marcar) { feitos.delete(k); datas.delete(k); }
      else { feitos.add(k); datas.set(k, dataAntiga); }
      desenharTudo();
      aviso('Não foi possível salvar: ' + error.message, true);
      return null;
    }
    return marcar;
  }

  // Primeiro dia ainda não concluído, na ordem do roteiro (null quando terminou tudo)
  function proximoPendente() {
    for (let p = 0; p < TOTAL_DIAS; p++) {
      const { semana, dia } = dePosicao(p);
      if (!feitos.has(chave(semana, dia))) return { semana, dia };
    }
    return null;
  }
  const feitosNaSemana = (semana) => DIAS_ROTEIRO.filter((_, dia) => feitos.has(chave(semana, dia))).length;

  // ---------- onde parei (banco) ----------
  // diaVisto é o dia aberto na aba Hoje. Fica salvo em user_state para abrir no mesmo ponto em outro aparelho.
  let diaVisto = { semana: 1, dia: 0 };
  let timerEstado;

  async function carregarEstado() {
    const { data, error } = await supabase.from('user_state').select('last_week, last_day').maybeSingle();
    if (error) return aviso('Não foi possível ler onde você parou: ' + error.message, true);
    const valido = data && data.last_week >= 1 && data.last_week <= SEMANAS.length && data.last_day !== null;
    diaVisto = valido ? { semana: data.last_week, dia: data.last_day } : (proximoPendente() ?? { semana: 1, dia: 0 });
  }

  // Espera um pouco antes de gravar, para não salvar a cada toque nas setas
  function salvarEstado() {
    clearTimeout(timerEstado);
    timerEstado = setTimeout(async () => {
      const { error } = await supabase.from('user_state')
        .upsert({ last_week: diaVisto.semana, last_day: diaVisto.dia }, { onConflict: 'user_id' });
      if (error) aviso('Não foi possível salvar onde você parou: ' + error.message, true);
    }, 800);
  }

  function verDia(semana, dia) {
    diaVisto = { semana, dia };
    salvarEstado();
    desenharHoje();
  }

  function desenharTudo() {
    desenharHoje();
    desenharRoteiro();
    desenharProgresso();
  }

  // ---------- hoje ----------
  const itemPasso = (p, passivo = false) => `<li class="passo${passivo ? ' passivo' : ''}">
      <span class="passo-min num-fonte">${esc(p.min)}</span>
      <div><b>${esc(p.titulo)}</b><p>${esc(p.texto)}</p>${p.recurso ? `<small>Recurso: ${esc(p.recurso)}</small>` : ''}</div>
    </li>`;
  const itemPalavra = (p) => `<li><b lang="en">${esc(p.termo)}</b><span>${esc(p.traducao)}</span></li>`;

  function desenharHoje() {
    const { semana, dia } = diaVisto;
    const s = SEMANAS[semana - 1];
    const p = posicao(semana, dia);
    const feito = feitos.has(chave(semana, dia));
    const pendente = proximoPendente();
    const foraDoPonto = pendente && (pendente.semana !== semana || pendente.dia !== dia);

    $('#hoje-semana').textContent = `Semana ${semana} de ${SEMANAS.length}`;
    $('#hoje-dia').textContent = DIAS_LONGOS[dia];
    $('[data-mudar-dia="-1"]').disabled = p === 0;
    $('[data-mudar-dia="1"]').disabled = p === TOTAL_DIAS - 1;

    if (!pendente && feito && p === TOTAL_DIAS - 1) {
      $('#hoje-corpo').innerHTML = `<section class="cartao concluida">
          <span class="selo-ok">${ICONE.checkG}</span>
          <span class="sobretitulo positivo">${TOTAL_DIAS} de ${TOTAL_DIAS} dias</span>
          <h1>Roteiro concluído!</h1>
          <p class="dica">Refaça a gravação de 3 minutos do checkpoint e compare com a da semana 1.</p>
        </section>`;
      return;
    }

    const passos = passosDoDia(semana, dia);
    const passivos = [
      { min: '60+', titulo: 'Tempos mortos', texto: `${TEMPOS_MORTOS[dia][0]}. Dê preferência ao conteúdo desta semana.`, recurso: TEMPOS_MORTOS[dia][1] },
      { min: 'livre', titulo: 'Micro-hábito da semana', texto: s.micro, recurso: '' },
    ];
    const grupo = dia < 6 ? s.v[dia] : null;
    const data = datas.get(chave(semana, dia));

    $('#hoje-corpo').innerHTML = `
      ${foraDoPonto ? `<button class="botao largo voltar-pendente" type="button" data-ir-pendente>Ir para onde parei: semana ${pendente.semana}, ${esc(DIAS_LONGOS[pendente.dia].toLowerCase())}</button>` : ''}
      <section class="cartao dia-cartao">
        <div class="linha-topo"><span class="sobretitulo">${esc(s.t)}</span><span class="selo">${minutosDoDia(semana, dia)} min</span></div>
        <h2>${esc(BLOCOS[dia])}</h2>
        <p class="dica">Meta da semana: ${esc(s.goal)}</p>
        ${feito ? `<p class="feito-em">${ICONE.checkP}Concluído${data ? ' em ' + esc(fmtDia(isoLocal(new Date(data)))) : ''}</p>` : ''}
      </section>
      <div class="hoje-layout">
        <div>
          <h2 class="sobretitulo grupo-titulo">Passo a passo <span class="num-fonte">minutos</span></h2>
          <ol class="passos cartao">${passos.map((x) => itemPasso(x)).join('')}</ol>
          <h2 class="sobretitulo grupo-titulo">Ao longo do dia</h2>
          <ul class="passos cartao">${passivos.map((x) => itemPasso(x, true)).join('')}</ul>
        </div>
        <div>
          ${grupo ? `<h2 class="sobretitulo grupo-titulo">Palavras de hoje <span>${esc(grupo[0])}</span></h2>
          <ul class="vocab cartao">${palavrasDoGrupo(grupo).map(itemPalavra).join('')}</ul>` : `<h2 class="sobretitulo grupo-titulo">Teste da semana</h2>
          <section class="cartao bloco"><p>${esc(s.check)}</p></section>`}
        </div>
      </div>
      <div class="acao-dia">
        ${feito
          ? '<button class="botao largo" type="button" data-alternar-hoje>Desmarcar dia</button>'
          : '<button class="botao primario grande" type="button" data-alternar-hoje>Concluir dia</button>'}
      </div>`;
  }

  $$('[data-mudar-dia]').forEach((b) => b.addEventListener('click', () => {
    const p = posicao(diaVisto.semana, diaVisto.dia) + Number(b.dataset.mudarDia);
    if (p < 0 || p >= TOTAL_DIAS) return;
    const { semana, dia } = dePosicao(p);
    verDia(semana, dia);
  }));

  $('#hoje-corpo').addEventListener('click', async (e) => {
    if (e.target.closest('[data-ir-pendente]')) {
      const pendente = proximoPendente();
      if (pendente) { verDia(pendente.semana, pendente.dia); window.scrollTo(0, 0); }
      return;
    }
    const botao = e.target.closest('[data-alternar-hoje]');
    if (!botao) return;
    botao.disabled = true;
    const marcou = await alternarDia(diaVisto.semana, diaVisto.dia);
    if (marcou === null) return;
    if (!marcou) return aviso('Dia desmarcado.');
    aviso('Dia concluído!');
    // Depois de concluir, a aba já mostra o próximo dia a fazer
    const pendente = proximoPendente();
    if (pendente) { verDia(pendente.semana, pendente.dia); window.scrollTo(0, 0); }
  });

  // ---------- roteiro ----------
  let semanaAberta = null;   // null = lista das semanas; número = detalhe daquela semana

  function desenharRoteiro() {
    $('#roteiro-lista').hidden = semanaAberta !== null;
    $('#roteiro-semana').hidden = semanaAberta === null;
    if (semanaAberta === null) desenharSemanas(); else desenharSemana(semanaAberta);
  }

  function desenharSemanas() {
    const pendente = proximoPendente();
    $('#lista-semanas').innerHTML = SEMANAS.map((s, i) => {
      const semana = i + 1;
      const n = feitosNaSemana(semana);
      return `<button class="cartao semana-card" type="button" data-semana="${semana}" ${pendente?.semana === semana ? 'aria-current="true"' : ''}>
          <div class="linha-topo"><span class="sobretitulo">Semana ${doisDigitos(semana)}${pendente?.semana === semana ? ' · atual' : ''}</span>
            <span class="selo${n === 7 ? ' feita' : ''}">${n}/7</span></div>
          <h2>${esc(s.t)}</h2>
          <p>${esc(s.s)}</p>
          <div class="trilho"><span class="${n === 7 ? 'dentro' : ''}" style="width: ${Math.round(n / 7 * 100)}%"></span></div>
        </button>`;
    }).join('');
  }

  function desenharSemana(semana) {
    const s = SEMANAS[semana - 1];
    const pendente = proximoPendente();
    const n = feitosNaSemana(semana);
    $('#roteiro-semana').innerHTML = `
      <header class="topo-semana">
        <button class="icone" type="button" data-voltar-roteiro aria-label="Voltar para o roteiro">${ICONE.voltar}</button>
        <div><span class="sobretitulo">Semana ${doisDigitos(semana)} · ${n}/7 dias</span><h1>${esc(s.t)}</h1></div>
      </header>
      <p class="dica">Meta da semana: ${esc(s.goal)}</p>
      <div class="semana-layout">
        <div>
          <h2 class="sobretitulo grupo-titulo">Dias</h2>
          <ul class="dias cartao">${DIAS_ROTEIRO.map((curto, dia) => {
            const feito = feitos.has(chave(semana, dia));
            const atual = pendente?.semana === semana && pendente.dia === dia;
            return `<li class="${feito ? 'feito' : ''}" ${atual ? 'aria-current="step"' : ''}>
                <button class="marcar" type="button" data-marcar="${dia}" aria-pressed="${feito}"
                  aria-label="${feito ? 'Desmarcar' : 'Marcar'} ${esc(DIAS_LONGOS[dia])} da semana ${semana} como ${feito ? 'não concluído' : 'concluído'}"><i>${ICONE.checkP}</i></button>
                <button class="dia-abrir" type="button" data-abrir-dia="${dia}">
                  <span class="nome"><small>${esc(curto)}</small><span>${esc(BLOCOS[dia])}</span></span>
                  <span class="num-fonte">${minutosDoDia(semana, dia)} min</span>
                </button>
              </li>`;
          }).join('')}</ul>
          <h2 class="sobretitulo grupo-titulo">Gramática e dicção</h2>
          <section class="cartao bloco">
            <h3>${esc(s.gram.t)}</h3>
            <p>${esc(s.gram.x)}</p>
            <ul class="exemplos" lang="en">${s.gram.e.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
            <p><b>Dicção:</b> ${esc(s.pron)}</p>
            <p><b>Micro-hábito:</b> ${esc(s.micro)}</p>
          </section>
        </div>
        <div>
          <h2 class="sobretitulo grupo-titulo">Recursos</h2>
          <section class="cartao bloco">
            <ul class="lista-texto">${s.res.map(([nome, tipo, uso]) =>
              `<li><a href="${esc(linkRecurso(nome, tipo))}" target="_blank" rel="noopener">${esc(nome)}</a> <small>· ${esc(TIPOS_RECURSO[tipo])}</small><br>${esc(uso)}</li>`).join('')}</ul>
          </section>
          <h2 class="sobretitulo grupo-titulo">Conteúdos para o barril</h2>
          <section class="cartao bloco">
            <ul class="lista-texto">${s.cont.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
          </section>
          <h2 class="sobretitulo grupo-titulo">Vocabulário</h2>
          <button class="botao largo" type="button" data-ver-vocab>Ver as ${totalPalavras(s)} palavras da semana</button>
        </div>
      </div>`;
  }

  $('#lista-semanas').addEventListener('click', (e) => {
    const card = e.target.closest('.semana-card');
    if (!card) return;
    semanaAberta = Number(card.dataset.semana);
    desenharRoteiro();
    window.scrollTo(0, 0);
  });

  $('#roteiro-semana').addEventListener('click', (e) => {
    if (e.target.closest('[data-voltar-roteiro]')) {
      semanaAberta = null;
      desenharRoteiro();
      return;
    }
    const marcar = e.target.closest('[data-marcar]');
    if (marcar) return alternarDia(semanaAberta, Number(marcar.dataset.marcar));
    const abrir = e.target.closest('[data-abrir-dia]');
    if (abrir) {
      verDia(semanaAberta, Number(abrir.dataset.abrirDia));
      return abrirAba('hoje');
    }
    if (e.target.closest('[data-ver-vocab]')) {
      filtroVocab = semanaAberta;
      $('#busca-vocab').value = '';
      desenharChipsVocab();
      abrirAba('vocabulario');
    }
  });

  // ---------- vocabulário ----------
  let filtroVocab = 1;   // número da semana, ou 0 para todas

  function desenharChipsVocab() {
    $('#chips-vocab').innerHTML = `<button class="chip" type="button" data-semana="0" aria-pressed="${filtroVocab === 0}">Todas</button>` +
      SEMANAS.map((_, i) => `<button class="chip" type="button" data-semana="${i + 1}" aria-pressed="${filtroVocab === i + 1}">Semana ${i + 1}</button>`).join('');
  }

  function desenharVocab() {
    const busca = normalizar($('#busca-vocab').value.trim());
    const blocos = [];
    SEMANAS.forEach((s, i) => {
      // A busca procura em todas as semanas; sem busca, vale o filtro dos chips
      if (!busca && filtroVocab !== 0 && filtroVocab !== i + 1) return;
      s.v.forEach((grupo) => {
        const palavras = palavrasDoGrupo(grupo).filter((p) =>
          !busca || normalizar(p.termo).includes(busca) || normalizar(p.traducao).includes(busca));
        if (!palavras.length) return;
        blocos.push(`<section>
            <h2 class="sobretitulo grupo-titulo">${esc(grupo[0])} <span>Semana ${i + 1}</span></h2>
            <ul class="vocab cartao">${palavras.map(itemPalavra).join('')}</ul>
          </section>`);
      });
    });
    $('#lista-vocab').innerHTML = blocos.join('') ||
      '<p class="cartao vazio">Nenhuma palavra encontrada. Tente outro termo, em inglês ou em português.</p>';
  }

  $('#chips-vocab').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    filtroVocab = Number(chip.dataset.semana);
    desenharChipsVocab();
    desenharVocab();
  });
  $('#busca-vocab').addEventListener('input', desenharVocab);

  // ---------- progresso ----------
  // Dias seguidos com pelo menos um dia do roteiro concluído, terminando hoje ou ontem
  function sequencia() {
    const dias = new Set([...datas.values()].map((d) => isoLocal(new Date(d))));
    const cursor = dataDeIso(hoje());
    if (!dias.has(isoLocal(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    while (dias.has(isoLocal(cursor))) { n++; cursor.setDate(cursor.getDate() - 1); }
    return n;
  }

  function desenharProgresso() {
    const total = feitos.size;
    const pendente = proximoPendente();
    const seguidos = sequencia();
    $('#resumo-progresso').innerHTML = `
      <div class="stat"><span>Concluído</span><b>${Math.round(total / TOTAL_DIAS * 100)}%</b></div>
      <div class="stat"><span>Dias feitos</span><b>${total} de ${TOTAL_DIAS}</b></div>
      <div class="stat"><span>Sequência</span><b>${seguidos} ${seguidos === 1 ? 'dia' : 'dias'}</b></div>
      <div class="stat"><span>Semana atual</span><b>${pendente ? `${pendente.semana} de ${SEMANAS.length}` : 'Fim'}</b></div>`;
    $('#lista-progresso').innerHTML = `<ul class="barras-cat cartao">${SEMANAS.map((s, i) => {
      const n = feitosNaSemana(i + 1);
      return `<li>
          <div class="linha-cat"><span>${doisDigitos(i + 1)} · ${esc(s.t)}</span><span class="num-fonte">${n}/7</span></div>
          <div class="trilho"><span class="${n === 7 ? 'dentro' : ''}" style="width: ${Math.round(n / 7 * 100)}%"></span></div>
        </li>`;
    }).join('')}</ul>`;
  }
</script>
</body>
</html>
